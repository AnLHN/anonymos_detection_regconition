name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_DIST_DIR: .next-ci

jobs:
  python-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create CI env
        shell: pwsh
        run: |
          Copy-Item .env.example .env

      - name: Compile Python files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch '\\.venv|__pycache__|\\.next|node_modules' } | ForEach-Object { $_.FullName }
          python -m py_compile $files

      - name: Import backend app
        run: |
          python -c "from backend.main import app; print(app.title)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Validate production compose
        shell: pwsh
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.production.yml config --quiet
