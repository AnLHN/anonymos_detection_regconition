name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_DIST_DIR: .next-ci
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # Python Backend Checks
  # ─────────────────────────────────────────────
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r requirements.txt

      - name: Create CI env
        run: cp .env.example .env

      - name: Lint with ruff
        run: |
          ruff check . --output-format=github

      - name: Compile Python files
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/.next/*" \
            -not -path "*/node_modules/*" \
            -exec python -m py_compile {} \;

      - name: Import backend app
        run: |
          python -c "from backend.main import app; print(app.title)"

  # ─────────────────────────────────────────────
  # Frontend Checks
  # ─────────────────────────────────────────────
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm run typecheck --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

  # ─────────────────────────────────────────────
  # Docker Compose Validation
  # ─────────────────────────────────────────────
  docker-checks:
    name: Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env
        run: cp .env.example .env

      - name: Validate development compose
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet

      - name: Validate production compose
        run: |
          docker compose --env-file .env -f infra/docker-compose.production.yml config --quiet

  # ─────────────────────────────────────────────
  # Dev Scripts Validation
  # ─────────────────────────────────────────────
  dev-scripts-checks:
    name: Dev Scripts Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create CI env
        run: cp .env.example .env

      - name: Validate camera zones contract
        run: python scripts/dev/validate_camera_zones_contract.py

      - name: Validate production env
        run: python scripts/dev/validate_production_env.py

  # ─────────────────────────────────────────────
  # Security Scanning
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: safety check -r requirements.txt --output text || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        run: npm audit --prefix frontend --audit-level=high || true
